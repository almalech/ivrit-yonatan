ommencer'}</button></div></div>`}function review(){let a=WORDS.filter(w=>(store.missed[w.id]||0)>0).sort((x,y)=>(store.missed[y.id]||0)-(store.missed[x.id]||0));return `<div class="card"><div class="eyebrow">Révision personnalisée</div><div class="title">Mes verbes difficiles</div><p class="muted">Les mots ratés sont prioritaires. Un mot réussi plusieurs fois devient moins fréquent.</p>${a.length?a.map(w=>`<div class="word"><b dir="rtl">${safe(w.he)}</b> — ${safe(w.fr)} <span class="pill">${store.missed[w.id]} erreur(s)</span></div>`).join(''):'<div class="notice">Aucune erreur enregistrée pour le moment.</div>'}<button class="btn" data-review="1">Réviser maintenant</button></div>`}function progress(){return `<div class="card"><div class="eyebrow">Tes progrès</div><div class="title">Tu avances à ton rythme</div><div class="grid"><div class="stat"><b>${store.stats.done}</b>Questions</div><div class="stat"><b>${store.stats.done?Math.round(100*store.stats.correct/store.stats.done):0}%</b>Réussite</div><div class="stat"><b>${Object.keys(store.seen).length}</b>Mots étudiés</div><div class="stat"><b>${WORDS.filter(w=>store.missed[w.id]>0).length}</b>À revoir</div></div><p class="muted">Les résultats restent dans ce navigateur sur cet appareil.</p><div class="actions"><button class="btn secondary" data-export="1">Sauvegarder mes progrès</button><label style="margin:0"><span class="btn ghost" style="display:inline-block">Restaurer une sauvegarde</span><input type="file" id="restore" accept="application/json" style="display:none"></label></div></div>`}function rolesView(){if(role===null)return `<div class="card"><div class="eyebrow">Mode aventure 🎭 · Kita Alef</div><div class="title">5 aventures faciles de 20 échanges</div><p class="muted">Toutes les phrases et toutes les réponses sont en hébreu. Appuie sur 💡 seulement si tu as besoin d’une traduction. Utilise 💡 si tu ne comprends pas. Les phrases sont courtes et au niveau Alef.</p>${MISSIONS.map((m,i)=>`<button class="choice" data-role="${i}"><b>${safe(m.name)}</b><div class="muted">${safe(m.intro)} · ${m.steps.length} échanges</div></button>`).join('')}</div>`;let m=MISSIONS[role],end=roleStep<0||roleStep>=m.steps.length;if(end)return `<div class="card"><div class="eyebrow">${safe(m.name)}</div><div class="title">${roleStep<0?'Mission interrompue':'🇮🇱 Mission terminée !'}</div><p class="muted">${roleHistory.length} échanges · ${roleErrors} réponse(s) à revoir · ${roleHints} aide(s) consultée(s)</p><div class="title">Bilan et traductions</div>${roleHistory.map(h=>`<div class="word"><div class="he" style="font-size:22px">${safe(h.he)}</div><div class="muted">${safe(h.questionFr)}</div><div class="he" style="font-size:20px">${safe(h.choice)}</div><div class="muted">${safe(h.meaning)} · ${h.score===-1?'Hors sujet':h.score===0?'Réponse possible, mais moins adaptée':'Réponse adaptée'}</div></div>`).join('')}<div class="actions"><button class="btn" data-role-retry="1">Rejouer</button><button class="btn secondary" data-role-back="1">Autre aventure</button></div></div>`;let q=m.steps[roleStep];return `<div class="card"><button class="btn ghost" data-role-back="1">← Aventures</button><div class="eyebrow">${safe(m.name)} · Échange ${roleStep+1}/${m.steps.length}</div><div class="progress"><div style="width:${100*roleStep/m.steps.length}%"></div></div><p class="muted">${safe(q.who)} :</p><div class="he" dir="rtl">${safe(q.he)}</div><div class="actions">${speakBtn(q.he)}<button class="btn ghost" data-role-hint="question">💡</button></div>${roleShowHints.question?`<div class="feedback">${safe(q.fr)}</div>`:''}<div class="title" style="margin-top:24px">מה אתה עונה?</div>${q.opts.map((o,i)=>`<div class="role-option"><button class="choice role-answer" data-role-answer="${i}" dir="rtl">${safe(o[0])}</button><button class="btn ghost role-hint" data-role-hint="${i}" aria-label="Traduire cette réponse">💡</button>${roleShowHints[i]?`<div class="muted" style="padding:0 12px 12px">${safe(o[1])}</div>`:''}</div>`).join('')}${roleNotice?`<div class="feedback">${safe(roleNotice)}</div>`:''}</div>`}

// V8 : jeux de verbes. Même stockage local que les versions précédentes.
const VERBS=WORDS.filter(w=>w.male&&w.female&&w.past);
function uniqueChoices(correct,other){return shuffle([correct,...other.filter(x=>x!==correct).filter((x,i,a)=>a.indexOf(x)===i).slice(0,3)]).slice(0,4)}
function makeMystery(){
 const candidates=VERBS.filter(w=>w.female&&w.male&&w.female!==w.male);
 const w=pick(candidates);const form=pick(['female','male','past']);
 let phrase=form==='female'?'היא ___ עכשיו.':form==='male'?'הוא ___ עכשיו.':'אתמול אני ___.',answer=form==='female'?w.female:form==='male'?w.male:w.past;
 if(!answer)return makeMystery();
 let others=[w.he,w.female,w.male,w.past,...shuffle(candidates.filter(x=>x.id!==w.id)).map(x=>x[form])].filter(Boolean);
 let opts=uniqueChoices(answer,others);
 // For a blank with subject, alternatives of the same verb are always grammatically relevant.
 if(opts.length<4)return makeMystery();
 mystery={w,form,phrase,answer,opts,chosen:null,done:false};
}
function mysteryView(){if(!mystery)return `<div class="card"><div class="eyebrow">Nouveau jeu · Conjugaison</div><div class="title">🧩 Le verbe mystère</div><p class="muted">Complète les phrases en choisissant la bonne forme du verbe. Présent féminin, masculin et passé. Les réponses sont en hébreu.</p><button class="btn" data-mystery-start="1">Commencer</button></div>`;
 let m=mystery;return `<div class="card"><div class="eyebrow">Le verbe mystère</div><div class="muted">Verbe : ${safe(m.w.fr)} <span dir="rtl" style="font-size:19px">(${safe(m.w.he)})</span></div><div class="he" style="margin:24px 0">${safe(m.phrase)}</div>${m.opts.map((x,i)=>`<button class="choice ${m.chosen===i?'selected':''}" dir="rtl" data-mystery-pick="${i}" ${m.done?'disabled':''}>${safe(x)}</button>`).join('')}${m.done?`<div class="feedback ${m.opts[m.chosen]===m.answer?'':'bad'}"><b>${m.opts[m.chosen]===m.answer?'Bravo ! 🇮🇱':'À revoir'}</b><div dir="rtl">${safe(m.phrase.replace('___',m.answer))}</div><div class="muted">${safe(m.w.fr)}</div></div><button class="btn" data-mystery-next="1">Phrase suivante →</button>`:''}</div>`}
function resetSurvival(){
 const all=shuffle(VERBS);survival={items:all,index:0,started:Date.now(),failed:false,finished:false,question:null};
 makeSurvivalQuestion();
 if(survivalTimer)clearInterval(survivalTimer);
 survivalTimer=setInterval(()=>{const t=document.getElementById('survival-clock');if(t&&survival)t.textContent=elapsedSurvival()},250);
}
function elapsedSurvival(){if(!survival)return '0:00';let sec=Math.floor(((survival.finishedAt||Date.now())-survival.started)/1000);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function makeSurvivalQuestion(){
 const w=survival.items[survival.index],reverse=survival.index%2===1;
 const bad=shuffle(VERBS.filter(x=>x.id!==w.id&&x.fr!==w.fr));
 const answer=reverse?w.fr:w.he;
 const options=uniqueChoices(answer,bad.map(x=>reverse?x.fr:x.he));
 survival.question={w,reverse,answer,options};
}
function survivalView(){if(!survival)return `<div class="card"><div class="eyebrow">Nouveau jeu · Challenge</div><div class="title">🏆 Le défi zéro faute</div><p class="muted">${VERBS.length} verbes, mélangés et sans répétition. Un seul mauvais choix : partie perdue et retour au début. Le chronomètre mesure ta rapidité, sans limite de temps.</p><div class="grid"><div class="stat"><b>${store.survivalBest}</b><span class="muted">Record de suite</span></div><div class="stat"><b>${store.survivalBestTime===null?'—':safe(store.survivalBestTime)}</b><span class="muted">Meilleur temps complet</span></div></div><div class="actions"><button class="btn" data-survival-start="1">Lancer le défi</button></div></div>`;
 let t=survival,q=t.question;
 let head=`<div class="eyebrow">🏆 Zéro faute</div><div class="grid"><div class="stat"><b>${t.index} / ${t.items.length}</b><span class="muted">Bonnes réponses</span></div><div class="stat"><b id="survival-clock">${elapsedSurvival()}</b><span class="muted">Chronomètre</span></div></div><div class="progress" style="margin-top:12px"><div style="width:${100*t.index/t.items.length}%"></div></div>`;
 if(t.failed)return `<div class="card">${head}<div class="title">❌ Perdu !</div><p>Tu avais enchaîné <b>${t.index} bonne(s) réponse(s)</b>. Une erreur = retour à zéro.</p><div class="feedback bad"><div>Question : ${safe(q.reverse?q.w.he:q.w.fr)}</div><div>Bonne réponse : <b>${safe(q.answer)}</b></div></div><p class="muted">Record personnel : ${store.survivalBest} / ${VERBS.length}</p><button class="btn" data-survival-start="1">Recommencer depuis zéro</button></div>`;
 if(t.finished)return `<div class="card">${head}<div class="title">🇮🇱 Sans-faute total !</div><p>Bravo ! ${VERBS.length} verbes sans une seule erreur en <b>${elapsedSurvival()}</b>.</p><p class="muted">Meilleur temps : ${safe(store.survivalBestTime)}</p><button class="btn" data-survival-start="1">Rejouer</button></div>`;
 return `<div class="card">${head}<p class="muted" style="margin-top:22px">${q.reverse?'Que veut dire ce verbe ?':'Traduis ce verbe en hébreu :'}</p>${q.reverse?`<div class="he">${safe(q.w.he)}</div>`:`<div class="title">${safe(q.w.fr)}</div>`}${q.options.map((o,i)=>`<button class="choice" data-survival-answer="${i}" ${q.reverse?'':'dir="rtl"'}>${safe(o)}</button>`).join('')}<p class="muted small">Une seule erreur et la série recommence. Record : ${store.survivalBest}.</p><button class="btn ghost" data-survival-exit="1">Quitter la partie</button></div>`;
}

// Clasico des verbes : 10 questions = 10 tirs, chaque bonne réponse donne un but à Marseille.
let football=null;
const FOOTBALL_SHOTS=10;
function startFootball(){football={items:shuffle(VERBS).slice(0,FOOTBALL_SHOTS),index:0,om:0,psg:0,locked:false,complete:false,answer:null};nextFootballQuestion();setTab('football')}
function nextFootballQuestion(){if(!football||football.index>=football.items.length){football.complete=true;return}const w=football.items[football.index];const candidates=shuffle(VERBS.filter(v=>v.id!==w.id&&v.fr!==w.fr));football.question={w,options:shuffle([w,...candidates.slice(0,3)]).map(v=>({id:v.id,label:v.fr}))};football.locked=false;football.answer=null}
function footballView(){if(!football)return `<div class="card"><div class="eyebrow">Nouveau jeu · Spécial supporters</div><div class="title">⚽ Le Clasico des verbes</div><p class="muted">Marseille contre Paris ! Tu es le buteur de l’OM. Lis le verbe en hébreu et sélectionne sa traduction pour tirer. Chaque bonne réponse : un but pour Marseille. Chaque erreur : un but pour Paris.</p><p class="muted"><b>${FOOTBALL_SHOTS} tirs par match</b> · Des verbes simples de Kita Alef · Pas besoin de son.</p><button class="btn" data-foot-start="1">⚽ Jouer le match !</button></div>`;
const f=football;const scoreHtml=`<div class="foot-score"><div class="team">🔵⚪ MARSEILLE<small>${f.om} mot${f.om!==1?'s':''} gagné${f.om!==1?'s':''}</small></div><strong>${f.om} – ${f.psg}</strong><div class="team">🔴🔵 PARIS<small>${f.psg} mot${f.psg!==1?'s':''} gagné${f.psg!==1?'s':''}</small></div></div>`;
if(f.complete){const winner=f.om>f.psg?'om':f.om<f.psg?'psg':'draw';const message=winner==='om'?'MARSEILLE A GAGNÉ ! 💙🤍':winner==='psg'?'PARIS A GAGNÉ 😭😭':'MATCH NUL ! ⚽';return `<div class="card"><div class="eyebrow">Fin du match · ${FOOTBALL_SHOTS} tirs</div>${scoreHtml}<div class="foot-match-end"><div class="trophy">${winner==='om'?'🏆':winner==='psg'?'😭':'🤝'}</div><h2 class="${winner==='psg'?'loss':''}">${message}</h2><p>Marseille ${f.om} mots — Paris ${f.psg} mots</p><p class="muted">${winner==='om'?'Tu connais plus de mots que Paris !':'Rejoue pour prendre ta revanche et faire gagner Marseille !'}</p><button class="btn" data-foot-start="1">⚽ Revanche !</button></div></div>`}
return `<div class="card"><div class="eyebrow">⚽ CLASICO · Tir ${f.index+1}/${FOOTBALL_SHOTS}</div>${scoreHtml}<p class="muted" style="text-align:center;margin:13px 0 0">Que veut dire ce verbe ?</p><div class="he" style="text-align:center;margin:1px 0 0">${safe(f.question.w.he)}</div><div class="pitch" id="foot-pitch"><div class="goal-line"></div><div class="foot-targets">${f.question.options.map((v,i)=>`<button class="foot-target" data-foot-pick="${i}" ${f.locked?'disabled':''}>${safe(v.label)}</button>`).join('')}</div><div class="player" id="foot-player"><div class="player-arms"></div><div class="player-head"></div><div class="player-hair"></div><div class="player-shirt">9</div><div class="player-shorts"></div><div class="player-leg left"></div><div class="player-leg right"></div><div class="player-shoe left"></div><div class="player-shoe right"></div></div><div class="foot-ball" id="foot-ball">⚽</div><div class="foot-result" id="foot-result"></div></div><p class="foot-hint">Appuie sur la bonne traduction : le joueur tirera le ballon !</p></div>`}
function footballPick(i){if(!football||football.locked||football.complete)return;const f=football;f.locked=true;const opt=f.question.options[i];const good=opt.id===f.question.w.id;f.answer=i;f.om+=good?1:0;f.psg+=good?0:1;record(f.question.w,good);
const pitch=document.getElementById('foot-pitch'),ball=document.getElementById('foot-ball'),player=document.getElementById('foot-player'),result=document.getElementById('foot-result'),targets=pitch.querySelectorAll('.foot-target');targets.forEach(x=>x.disabled=true);targets[i].classList.add('chosen');player.classList.add('kicking');
// Diriger le ballon vers le centre de la réponse choisie, quelle que soit la largeur du téléphone.
const a=ball.getBoundingClientRect(),b=targets[i].getBoundingClientRect();const dx=(b.left+b.width/2)-(a.left+a.width/2),dy=(b.top+b.height/2)-(a.top+a.height/2);requestAnimationFrame(()=>{ball.style.transform=`translate(${dx}px, ${dy}px) scale(.6) rotate(540deg)`});
setTimeout(()=>{if(football!==f||tab!=='football')return;result.textContent=good?'BUUUUT ! ⚽':'TIR RATÉ ! 😭';result.classList.add('visible')},650);
setTimeout(()=>{if(football!==f||tab!=='football')return;f.index++;if(f.index>=f.items.length)f.complete=true;else nextFootballQuestion();render()},1650);
}

function render(){el.innerHTML=tab==='football'?footballView():tab==='mystery'?mysteryView():tab==='survival'?survivalView():tab==='roles'?rolesView():tab==='home'?home():tab==='situations'?situations():tab==='words'?words():tab==='quiz'?quizView():tab==='memory'?memoryView():tab==='review'?review():progress()}function record(w,good){store.stats.done++;if(good)store.stats.correct++;store.seen[w.id]=true;store.missed[w.id]=Math.max(0,(store.missed[w.id]||0)+(good?-1:1));store.levels[w.id]=Math.max(0,(store.levels[w.id]||0)+(good?1:-2));save()}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.tab){setTab(d.tab);return}if(d.go){setTab(d.go);return}if(d.speak){speak(d.speak);return}if(d.learn){store.seen[d.learn]=true;save();render();return}if(d.known){store.known[d.known]=!store.known[d.known];store.seen[d.known]=true;save();render();return}if(d.footStart){startFootball();return}if(d.footPick!==undefined){footballPick(Number(d.footPick));return}if(d.mysteryStart||d.mysteryNext){makeMystery();setTab('mystery');return}
if(d.mysteryPick!==undefined){if(!mystery||mystery.done)return;mystery.chosen=Number(d.mysteryPick);mystery.done=true;record(mystery.w,mystery.opts[mystery.chosen]===mystery.answer);render();return}
if(d.survivalStart){resetSurvival();setTab('survival');return}
if(d.survivalExit){if(survivalTimer)clearInterval(survivalTimer);survival=null;render();return}
