r:shuffle(a),matched:[],attempts:0};memorySelected=null;memoryWrong=false;setTab('memory')}function memoryView(){if(!memory)return `<div class="card"><div class="eyebrow">Jeu d’associations</div><div class="title">Relie les verbes 🎯</div><p class="muted">Des séries différentes jusqu’à avoir parcouru tous les mots. Les erreurs seront ajoutées à tes révisions.</p><label>Paires par partie</label><select id="memory-size"><option value="5" ${memorySize===5?'selected':''}>5 paires</option><option value="6" ${memorySize===6?'selected':''}>6 paires</option></select><p class="muted">Cycle : ${store.memoryCycle.length} / ${WORDS.filter(w=>!store.known[w.id]).length} mots parcourus</p><button class="btn" data-memory-start="1">Jouer</button></div>`;let m=memory,done=m.matched.length;return `<div class="card"><div class="eyebrow">Memory des verbes</div><div class="title">${done===m.items.length?'Bravo, partie terminée ! 🇮🇱':'Associe les deux colonnes'}</div><p class="muted">${done}/${m.items.length} paires · ${m.attempts} essais · Cycle : ${store.memoryCycle.length}/${WORDS.filter(w=>!store.known[w.id]).length}</p><div class="progress"><div style="width:${100*done/m.items.length}%"></div></div><p class="muted">Appuie sur un verbe en hébreu, puis sur sa traduction.</p><div class="memorycols"><div class="memorylist">${m.items.map(w=>`<button class="matchbtn hebrew ${m.matched.includes(w.id)?'done':memorySelected===w.id?'chosen':''}" data-memory-he="${safe(w.id)}" ${m.matched.includes(w.id)?'disabled':''}>${hebField(w,"he")}</button>`).join('')}</div><div class="memorylist">${m.order.map(w=>`<button class="matchbtn ${m.matched.includes(w.id)?'done':''}" data-memory-fr="${safe(w.id)}" ${m.matched.includes(w.id)?'disabled':''}>${safe(w.fr)}</button>`).join('')}</div></div>${memoryWrong?'<p style="color:#A54651">Essaie encore !</p>':''}${done===m.items.length?'<div class="feedback">Partie réussie !</div>':''}<div class="actions"><button class="btn" data-memory-start="1">${done===m.items.length?'Nouvelle partie':'Recommencer'}</button></div></div>`}function review(){let a=WORDS.filter(w=>(store.missed[w.id]||0)>0).sort((x,y)=>(store.missed[y.id]||0)-(store.missed[x.id]||0));return `<div class="card"><div class="eyebrow">Révision personnalisée</div><div class="title">Mes verbes difficiles</div><p class="muted">Les mots ratés sont prioritaires. Un mot réussi plusieurs fois devient moins fréquent.</p>${a.length?a.map(w=>`<div class="word"><b dir="rtl">${hebField(w,"he")}</b> — ${safe(w.fr)} <span class="pill">${store.missed[w.id]} erreur(s)</span></div>`).join(''):'<div class="notice">Aucune erreur enregistrée pour le moment.</div>'}<button class="btn" data-review="1">Réviser maintenant</button></div>`}function progress(){return `<div class="card"><div class="eyebrow">Tes progrès</div><div class="title">Tu avances à ton rythme</div><div class="grid"><div class="stat"><b>${store.stats.done}</b>Questions</div><div class="stat"><b>${store.stats.done?Math.round(100*store.stats.correct/store.stats.done):0}%</b>Réussite</div><div class="stat"><b>${Object.keys(store.seen).length}</b>Mots étudiés</div><div class="stat"><b>${WORDS.filter(w=>store.missed[w.id]>0).length}</b>À revoir</div></div><p class="muted">Les résultats restent dans ce navigateur sur cet appareil.</p><div class="actions"><button class="btn secondary" data-export="1">Sauvegarder mes progrès</button><label style="margin:0"><span class="btn ghost" style="display:inline-block">Restaurer une sauvegarde</span><input type="file" id="restore" accept="application/json" style="display:none"></label></div></div>`}function rolesView(){if(role===null)return `<div class="card"><div class="eyebrow">Mode aventure 🎭 · Kita Alef</div><div class="title">5 aventures faciles de 20 échanges</div><p class="muted">Toutes les phrases et toutes les réponses sont en hébreu. Appuie sur 💡 seulement si tu as besoin d’une traduction. Utilise 💡 si tu ne comprends pas. Les phrases sont courtes et au niveau Alef.</p>${MISSIONS.map((m,i)=>`<button class="choice" data-role="${i}"><b>${safe(m.name)}</b><div class="muted">${safe(m.intro)} · ${m.steps.length} échanges</div></button>`).join('')}</div>`;let m=MISSIONS[role],end=roleStep<0||roleStep>=m.steps.length;if(end)return `<div class="card"><div class="eyebrow">${safe(m.name)}</div><div class="title">${roleStep<0?'Mission interrompue':'🇮🇱 Mission terminée !'}</div><p class="muted">${roleHistory.length} échanges · ${roleErrors} réponse(s) à revoir · ${roleHints} aide(s) consultée(s)</p><div class="title">Bilan et traductions</div>${roleHistory.map(h=>`<div class="word"><div class="he" style="font-size:22px">${heb(h.he)}</div><div class="muted">${safe(h.questionFr)}</div><div class="he" style="font-size:20px">${heb(h.choice)}</div><div class="muted">${safe(h.meaning)} · ${h.score===-1?'Hors sujet':h.score===0?'Réponse possible, mais moins adaptée':'Réponse adaptée'}</div></div>`).join('')}<div class="actions"><button class="btn" data-role-retry="1">Rejouer</button><button class="btn secondary" data-role-back="1">Autre aventure</button></div></div>`;let q=m.steps[roleStep];return `<div class="card"><button class="btn ghost" data-role-back="1">← Aventures</button><div class="eyebrow">${safe(m.name)} · Échange ${roleStep+1}/${m.steps.length}</div><div class="progress"><div style="width:${100*roleStep/m.steps.length}%"></div></div><p class="muted">${safe(q.who)} :</p><div class="he" dir="rtl">${heb(q.he)}</div><div class="actions">${speakBtn(q.he)}<button class="btn ghost" data-role-hint="question">💡</button></div>${roleShowHints.question?`<div class="feedback">${safe(q.fr)}</div>`:''}<div class="title" style="margin-top:24px">מה אתה עונה?</div>${q.opts.map((o,i)=>`<div class="role-option"><button class="choice role-answer" data-role-answer="${i}" dir="rtl">${heb(o[0])}</button><button class="btn ghost role-hint" data-role-hint="${i}" aria-label="Traduire cette réponse">💡</button>${roleShowHints[i]?`<div class="muted" style="padding:0 12px // V8 : jeux de verbes. Même stockage local que les versions précédentes.
const VERBS=WORDS.filter(w=>w.male&&w.female&&w.past);
function uniqueChoices(correct,other){return shuffle([correct,...other.filter(x=>x!==correct).filter((x,i,a)=>a.indexOf(x)===i).slice(0,3)]).slice(0,4)}
function makeMystery(){
 const candidates=VERBS.filter(w=>w.female&&w.male&&w.female!==w.male);
 const w=pick(candidates);const form=pick(['female','male','past']);
 let phrase=form==='female'?'היא ___ עכשיו.':form==='male'?'הוא ___ עכשיו.':'אתמול אני ___.',answer=form==='female'?w.female:form==='male'?w.male:w.past;
 if(!answer)return makeMystery();
 let others=[w.he,w.female,w.male,w.past,...shuffle(candidates.filter(x=>x.id!==w.id)).map(x=>x[form])].filter(Boolean);
 let opts=uniqueChoices(answer,others);
 // For a blank with subject, alternatives of the same verb are always grammatically relevant.
 if(opts.length<4)return makeMystery();
 mystery={w,form,phrase,answer,opts,chosen:null,done:false};
}
function mysteryView(){if(!mystery)return `<div class="card"><div class="eyebrow">Nouveau jeu · Conjugaison</div><div class="title">🧩 Le verbe mystère</div><p class="muted">Complète les phrases en choisissant la bonne forme du verbe. Présent féminin, masculin et passé. Les réponses sont en hébreu.</p><button class="btn" data-mystery-start="1">Commencer</button></div>`;
 let m=mystery;return `<div class="card"><div class="eyebrow">Le verbe mystère</div><div class="muted">Verbe : ${safe(m.w.fr)} <span dir="rtl" style="font-size:19px">(${heb(m.w.he)})</span></div><div class="he" style="margin:24px 0">${heb(m.phrase)}</div>${m.opts.map((x,i)=>`<button class="choice ${m.chosen===i?'selected':''}" dir="rtl" data-mystery-pick="${i}" ${m.done?'disabled':''}>${heb(x)}</button>`).join('')}${m.done?`<div class="feedback ${m.opts[m.chosen]===m.answer?'':'bad'}"><b>${m.opts[m.chosen]===m.answer?'Bravo ! 🇮🇱':'À revoir'}</b><div dir="rtl">${heb(m.phrase.replace('___',m.answer))}</div><div class="muted">${safe(m.w.fr)}</div></div><button class="btn" data-mystery-next="1">Phrase suivante →</button>`:''}</div>`}
function resetSurvival(){
 const all=shuffle(VERBS);survival={items:all,index:0,started:Date.now(),failed:false,finished:false,question:null};
 makeSurvivalQuestion();
 if(survivalTimer)clearInterval(survivalTimer);
 survivalTimer=setInterval(()=>{const t=document.getElementById('survival-clock');if(t&&survival)t.textContent=elapsedSurvival()},250);
}
function elapsedSurvival(){if(!survival)return '0:00';let sec=Math.floor(((survival.finishedAt||Date.now())-survival.started)/1000);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function makeSurvivalQuestion(){
 const w=survival.items[survival.index],reverse=survival.index%2===1;
 const bad=shuffle(VERBS.filter(x=>x.id!==w.id&&x.fr!==w.fr));
 const answer=reverse?w.fr:w.he;
 const options=uniqueChoices(answer,bad.map(x=>reverse?x.fr:x.he));
 survival.question={w,reverse,answer,options};
}
function survivalView(){if(!survival)return `<div class="card"><div class="eyebrow">Nouveau jeu · Challenge</div><div class="title">🏆 Le défi zéro faute</div><p class="muted">${VERBS.length} verbes, mélangés et sans répétition. Un seul mauvais choix : partie perdue et retour au début. Le chronomètre mesure ta rapidité, sans limite de temps.</p><div class="grid"><div class="stat"><b>${store.survivalBest}</b><span class="muted">Record de suite</span></div><div class="stat"><b>${store.survivalBestTime===null?'—':safe(store.survivalBestTime)}</b><span class="muted">Meilleur temps complet</span></div></div><div class="actions"><button class="btn" data-survival-start="1">Lancer le défi</button></div></div>`;
 let t=survival,q=t.question;
 let head=`<div class="eyebrow">🏆 Zéro faute</div><div class="grid"><div class="stat"><b>${t.index} / ${t.items.length}</b><span class="muted">Bonnes réponses</span></div><div class="stat"><b id="survival-clock">${elapsedSurvival()}</b><span class="muted">Chronomètre</span></div></div><div class="progress" style="margin-top:12px"><div style="width:${100*t.index/t.items.length}%"></div></div>`;
 if(t.failed)return `<div class="card">${head}<div class="title">❌ Perdu !</div><p>Tu avais enchaîné <b>${t.index} bonne(s) réponse(s)</b>. Une erreur = retour à zéro.</p><div class="feedback bad"><div>Question : ${safe(q.reverse?pointed(q.w.he):q.w.fr)}</div><div>Bonne réponse : <b>${heb(q.answer)}</b></div></div><p class="muted">Record personnel : ${store.survivalBest} / ${VERBS.length}</p><button class="btn" data-survival-start="1">Recommencer depuis zéro</button></div>`;
 if(t.finished)return `<div class="card">${head}<div class="title">🇮🇱 Sans-faute total !</div><p>Bravo ! ${VERBS.length} verbes sans une seule erreur en <b>${elapsedSurvival()}</b>.</p><p class="muted">Meilleur temps : ${safe(store.survivalBestTime)}</p><button class="btn" data-survival-start="1">Rejouer</button></div>`;
 return `<div class="card">${head}<p class="muted" style="margin-top:22px">${q.reverse?'Que veut dire ce verbe ?':'Traduis ce verbe en hébreu :'}</p>${q.reverse?`<div class="he">${heb(q.w.he)}</div>`:`<div class="title">${safe(q.w.fr)}</div>`}${q.options.map((o,i)=>`<button class="choice" data-survival-answer="${i}" ${q.reverse?'':'dir="rtl"'}>${safe(o)}</button>`).join('')}<p class="muted small">Une seule erreur et la série recommence. Record : ${store.survivalBest}.</p><button class="btn ghost" data-survival-exit="1">Quitter la partie</button></div>`;
}

// Diriger le ballon vers le centre de la réponse choisie, quelle que soit la largeur du téléphone.

function clearPoints(text){return String(text||'').normalize('NFD').replace(/[\u0591-\u05C7]/g,'').normalize('NFC')}
function normalizedHeb(text){return clearPoints(text).replace(/[\s.,!?״׳]/g,'').trim()}
function learnPool(){return VERBS.filter(w=>w.he&&w.male&&w.female&&w.past && normalizedHeb(w.he)!==normalizedHeb(w.male))}
let conjugate=null, fillGame=null;

 const form=pick(['male','female','past']);
 const subject=form==='female'?'היא':form==='male'?'אני':'אתמול אני';
 const formFrench=form==='female'?'Elle (au féminin)':form==='male'?'Je (au masculin)':'Hier, je';
 const correct=w[form], hint=form==='past'?'Au passé : utilise la forme « j’ai… »':form==='male'?'Présent masculin : après אני, on conjugue le verbe.':'Présent féminin : après היא, on conjugue le verbe.';
 const example=LEARN_EXAMPLES[w.he]||['',''];
 const q={w,form,subject,formFrench,correct,hint,example,answered:false,chosen:null,good:false};
 if(mode==='conjugate'){
   const choices=[correct,w.he,w[form==='male'?'female':'male'],w.past,...shuffle(list.filter(x=>x.id!==w.id)).map(x=>x[form])].filter(Boolean);
   q.options=shuffle([correct,...choices.filter(x=>normalizedHeb(x)!==normalizedHeb(correct)).filter((x,i,a)=>a.findIndex(y=>normalizedHeb(y)===normalizedHeb(x))===i).slice(0,3)]);
   conjugate=q;
 }else{fillGame=q;}
}
function explainLearn(q){return `<div class="learn-feedback ${q.good?'':'wrong'}"><b>${q.good?'Bravo ! ✅':'À revoir ❌'}</b><div class="he">${heb(q.subject)} ${hebField(q.w,q.form)} ${heb(q.example[0])}</div><div>Bonne réponse : <b dir="rtl">${hebField(q.w,q.form)}</b> · ${safe(q.w.fr)}</div><p class="muted">${safe(q.hint)} Un infinitif commence souvent par ל, mais après le sujet on utilise une forme conjuguée.</p></div>`}
function conjugateView(){
 if(!conjugate)return `<div class="card"><div class="eyebrow">Spécial Kita Alef</div><div class="title">✍️ Je conjugue</div><p>Exemple : <b>לִלְמוֹד</b> = apprendre, mais <b>אני לוֹמֵד</b> = j’apprends (masculin).</p><p class="muted">Choisis entre l’infinitif, le masculin, le féminin et le passé. Une explication t’aide après chaque réponse.</p><button class="btn" data-conj-next="1">Commencer</button></div>`;
 let q=conjugate;return `<div class="card"><div class="eyebrow">✍️ Je conjugue · ${safe(q.formFrench)}</div><div class="title">Verbe : ${safe(q.w.fr)}</div><p class="he">${hebField(q.w,'he')}</p><p class="muted">Complète la phrase en choisissant la bonne forme.</p><div class="he" style="background:#eff6fd;padding:16px;border-radius:13px">${heb(q.subject)} ___ ${heb(q.example[0])}</div><div class="learn-options">${q.options.map((opt,i)=>`<button data-conj-choice="${i}" ${q.answered?'disabled':''}>${heb(opt)}</button>`).join('')}</div>${q.answered?explainLearn(q)+`<button class="btn" data-conj-next="1">Question suivante</button>`:''}</div>`
}
function fillGameView(){
 if(!fillGame)return `<div class="card"><div class="eyebrow">Kita Alef · écriture</div><div class="title">📝 Complète la phrase</div><p>Cette fois, c’est toi qui écris le bon verbe en hébreu !</p><p class="muted">Les nékoudot sont utiles pour lire, mais pas obligatoires dans ta réponse.</p><button class="btn" data-fill-next="1">Commencer</button></div>`;
 let q=fillGame;return `<div class="card"><div class="eyebrow">📝 Complète · ${safe(q.formFrench)}</div><div class="title">Verbe : ${safe(q.w.fr)}</div><p class="he">${hebField(q.w,'he')}</p><div class="he" style="background:#eff6fd;padding:16px;border-radius:13px">${heb(q.subject)} ___ ${heb(q.example[0])}</div><p class="muted">Écris le mot manquant en hébreu :</p><input class="learn-input" lang="he" dir="rtl" id="fill-heb-answer" autocomplete="off" spellcheck="false" placeholder="Écris ici" ${q.answered?'disabled':''} />${q.answered?explainLearn(q)+`<button class="btn" data-fill-next="1">Phrase suivante</button>`:`<div style="margin-top:12px"><button class="btn" data-fill-check="1">Vérifier</button></div>`}</div>`
}

function render(){document.querySelectorAll("[data-nikud-toggle]").forEach(b=>b.textContent=showNikud?"נִקּוּד ✓":"ניקוד ○");el.innerHTML=tab==='football'?footballView():tab==='conjugate'?conjugateView():tab==='fill'?fillGameView():tab==='mystery'?mysteryView():tab==='survival'?survivalView():tab==='roles'?rolesView():tab==='home'?home():tab==='situations'?situations():tab==='words'?words():tab==='quiz'?quizView():tab==='memory'?memoryView():tab==='review'?review():progress()}function record(w,good){store.stats.done++;if(good)store.stats.correct++;store.seen[w.id]=true;store.missed[w.id]=Math.max(0,(store.missed[w.id]||0)+(good?-1:1));store.levels[w.id]=Math.max(0,(store.levels[w.id]||0)+(good?1:-2));save()}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.nikudToggle!==undefined){showNikud=!showNikud;localStorage.setItem("yonatan-nikud",showNikud?"on":"off");render();return}if(d.tab){setTab(d.tab);return}if(d.go){setTab(d.go);return}if(d.speak){speak(d.speak);return}if(d.learn){store.seen[d.learn]=true;save();render();return}if(d.known){store.known[d.known]=!store.known[d.known];store.seen[d.known]=true;save();render();return}if(d.conjNext){learnNext('conjugate');render();return}if(d.conjChoice!==undefined){if(conjugate&&!conjugate.answered){conjugate.chosen=Number(d.conjChoice);conjugate.good=normalizedHeb(conjugate.options[conjugate.chosen])===normalizedHeb(conjugate.correct);conjugate.answered=true;record(conjugate.w,conjugate.good);render()}return}if(d.fillNext){learnNext('fill');render();return}if(d.fillCheck){if(fillGame&&!fillGame.answered){const inp=document.getElementById('fill-heb-answer');fillGame.good=normalizedHeb(inp.value)===normalizedHeb(fillGame.correct);fillGame.answered=true;record(fillGame.w,fillGame.good);render()}return}if(d.footStart){startFootball();return}if(d.footPick!==undefined){footballPick(Number(d.footPick));return}if(d.mysteryStart||d.mysteryNext){makeMystery();setTab('mystery');return}
if(d.mysteryPick!==undefined){if(!mystery||mystery.done)return;mystery.chosen=Number(d.mysteryPick);mystery.done=true;record(mystery.w,mystery.opts[mystery.chosen]===mystery.answer);render();return}
if(d.survivalStart){resetSurvival();setTab('survival');return}
if(d.survivalExit){if(survivalTimer)clearInterval(survivalTimer);survival=null;render();return}
if(d.survivalAnswer!==undefined){if(!survival||survival.failed||survival.finished)return;let t=survival,q=t.question;let good=q.options[Number(d.survivalAnswer)]===q.answer;record(q.w,good);if(!good){t.failed=true;t.finishedAt=Date.now();if(survivalTimer)clearInterval(survivalTimer)}else{t.index++;if(t.index>store.survivalBest){store.survivalBest=t.index;save()}if(t.index===t.items.length){t.finished=true;t.finishedAt=Date.now();if(survivalTimer)clearInterval(survivalTimer);let secs=Math.round((t.finishedAt-t.started)/1000),best=store.survivalBestSeconds;if(best===undefined||secs<best){store.survivalBestSeconds=secs;store.survivalBestTime=elapsedSurvival();save()}}else makeSurvivalQuestion()}render();return}
if(d.role!==undefined){role=Number(d.role);roleStep=0;roleErrors=0;roleHistory=[];roleShowHints={};roleHints=0;roleNotice='';MISSIONS[role].steps.forEach(q=>q.opts=shuffle(q.opts));setTab('roles');return}if(d.roleBack){role=null;roleShowHints={};render();return}if(d.roleHint!==undefined){if(!roleShowHints[d.roleHint])roleHints++;roleShowHints[d.roleHint]=!roleShowHints[d.roleHint];render();return}if(d.roleAnswer!==undefined){let q=MISSIONS[role].steps[roleStep],opt=q.opts[Number(d.roleAnswer)];roleHistory.push({he:q.he,questionFr:q.fr,choice:opt[0],meaning:opt[1],score:opt[2]});if(opt[2]===-1){roleErrors++;roleNotice='Cette réponse ne convient pas à la situation. Tu peux réessayer.';roleShowHints={};render();return}else if(opt[2]===0){roleErrors++;roleNotice='Réponse possible, mais essaie de répondre plus directement.'}else roleNotice='';roleStep++;roleShowHints={};render();return}if(d.roleRetry){roleStep=0;roleErrors=0;roleHistory=[];roleShowHints={};roleHints=0;roleNotice='';MISSIONS[role].steps.forEach(q=>q.opts=shuffle(q.opts));render();return}if(d.situation!==undefined){situation=Number(d.situation);setTab('situations');return}if(d.back){situation=null;render();return}if(d.situationQuiz){focus=d.situationQuiz;startQuiz();return}if(d.start){startQuiz();return}if(d.choice!==undefined){if(!checked){selected=Number(d.choice);render()}return}if(d.check){if(selected===null)return;checked=true;record(quiz.w,selected===quiz.correct);render();return}if(d.next){startQuiz();return}if(d.review){focus='À consolider';startQuiz();return}if(d.memoryStart){startMemory();return}if(d.memoryHe!==undefined){memorySelected=d.memoryHe;memoryWrong=false;render();return}if(d.memoryFr!==undefined){if(!memory||memorySelected===null)return;let w=memory.items.find(x=>x.id===memorySelected);memory.attempts++;let good=d.memoryFr===memorySelected;if(good){memory.matched.push(memorySelected);memorySelected=null;memoryWrong=false}else memoryWrong=true;record(w,good);render();return}if(d.export){let blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ivrit-yonatan-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}});document.addEventListener('change',async e=>{if(e.target.id==='memory-size'){memorySize=Number(e.target.value)}if(e.target.id==='role-level'){roleLevel=e.target.value;render()}if(e.target.id==='category'){category=e.target.value;render()}if(e.target.id==='focus'){focus=e.target.value}if(e.target.id==='restore'){try{let s=JSON.parse(await e.target.files[0].text());if(!s.seen||!s.stats)throw Error('Fichier incorrect');store=s;store.missed??={};store.levels??={};store.survivalBest??=0;store.survivalBestTime??=null;save();render();alert('Sauvegarde restaurée')}catch(err){alert('Impossible de restaurer ce fichier')}}});render();
</script></body></html>
