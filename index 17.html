:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#17334E;background:#F2F7FD}*{box-sizing:border-box}body{margin:0}header{background:#0868B9;color:white;padding:23px 18px;border-radius:0 0 25px 25px}header h1{margin:0;font-size:25px}header p{margin:6px 0 0;color:#E8F5FF;font-size:14px}.wrap{max-width:690px;margin:auto;padding:0 15px 35px}.tabs{display:flex;gap:7px;overflow-x:auto;padding:16px 0;position:sticky;top:0;background:#F2F7FD;z-index:3}.tabs button{white-space:nowrap;border:1px solid #C5DAEF;background:white;color:#185E9B;border-radius:12px;padding:10px 12px;font-weight:650}.tabs button.active{background:#D7EAFC;border-color:#91C3EB}.card{background:white;border:1px solid #D9E6F4;border-radius:19px;padding:18px;margin-bottom:13px;box-shadow:0 3px 12px #0868B910}.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#497FAE;font-weight:750}.title{font-size:22px;font-weight:750;margin:8px 0}.muted{color:#627990;font-size:14px;line-height:1.5}.he{direction:rtl;text-align:right;font-size:31px;font-weight:700;line-height:1.5}.phon{color:#497FAE;font-style:italic}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:750;font-size:15px;background:#0868B9;color:white;cursor:pointer}.btn.secondary{background:#E1F0FE;color:#185E9B}.btn.ghost{background:white;color:#0868B9;border:1px solid #D8E6F2}.btn:disabled{opacity:.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#E0EDF9;padding:14px;border-radius:13px}.stat b{display:block;font-size:25px}.choice{display:block;width:100%;text-align:left;padding:13px;margin:8px 0;background:#FFFFFF;border:1px solid #D1E3F2;border-radius:12px;color:#17334E;font-size:16px}.choice.selected{border:2px solid #4596D8;background:#E6F3FE}.feedback{background:#E1F0FE;border-radius:12px;padding:12px;margin-top:12px;line-height:1.5}.feedback.bad{background:#FFEDEA}.word{border-bottom:1px solid #D9E6F4;padding:13px 0}.word:last-child{border:0}.pill{display:inline-block;background:#DCEEFF;color:#0868B9;border-radius:20px;padding:4px 8px;font-size:12px}.memorycols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.memorylist{display:flex;flex-direction:column;gap:7px}.matchbtn{width:100%;min-height:55px;border:1px solid #C3DCEF;background:#FFFFFF;border-radius:12px;padding:9px 5px;font-size:14px;color:#17334E;overflow-wrap:anywhere}.matchbtn.hebrew{font-size:22px;direction:rtl}.matchbtn.chosen{background:#D7EAFC;border:2px solid #0868B9}.matchbtn.done{background:#E4F0E5;color:#47735A}.notice{background:#fff7e7;padding:12px;border-radius:12px;font-size:13px}select,input{width:100%;padding:12px;border:1px solid #C3DCEF;border-radius:11px;background:white;font-size:15px}label{display:block;font-size:13px;margin:10px 0 5px;color:#185E9B;font-weight:700}footer{color:#6B8198;text-align:center;font-size:12px;padding:10px}.progress{height:9px;background:#D7E6F4;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#4596D8}.small{font-size:12px}@media(max-width:360px){.grid{grid-template-columns:1fr}.he{font-size:25px}}
.role-option{position:relative;margin:9px 0;border:1px solid #D1E3F2;border-radius:12px;overflow:hidden;background:#FFFFFF}.role-option .choice{margin:0;padding-right:57px;border:0;border-radius:0;text-align:right;font-size:21px;line-height:1.55}.role-hint{position:absolute;right:7px;top:7px;padding:9px!important;font-size:18px!important}.role-answer{min-height:65px}
/* Mini-match : le terrain et le personnage sont construits en CSS, sans ressource externe */
.foot-score{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border-radius:15px;background:#073765;color:white;margin:12px 0}.foot-score .team{flex:1;text-align:center;font-size:13px;font-weight:800}.foot-score strong{font-size:29px;letter-spacing:.05em}.foot-score small{display:block;font-size:11px;font-weight:500;color:#cce6ff}.pitch{height:325px;position:relative;overflow:hidden;background:repeating-linear-gradient(0deg,#158146 0px,#158146 49px,#18894c 49px,#18894c 98px);border-radius:18px;border:4px solid #d2ecff;margin:13px 0 8px;isolation:isolate;touch-action:manipulation}.pitch:before{content:"";position:absolute;inset:11px;border:2px solid #ffffff87;border-radius:3px;pointer-events:none}.pitch:after{content:"";position:absolute;left:50%;top:55%;width:88px;height:88px;border:2px solid #ffffff70;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.goal-line{position:absolute;top:10px;left:8%;width:84%;height:75px;border:3px solid #eef9ffab;border-bottom:0;background:repeating-linear-gradient(90deg,#ffffff14 0 11px,#ffffff38 12px 13px);pointer-events:none}.foot-targets{position:absolute;top:14px;left:0;right:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:0 8px;z-index:2}.foot-target{background:#fff;color:#073765;border:2px solid #c6eaff;border-radius:10px;min-height:66px;padding:5px 2px;font-size:clamp(10px,2.65vw,14px);font-weight:800;line-height:1.2;overflow-wrap:anywhere;box-shadow:0 3px 0 #07376550;cursor:pointer}.foot-target:disabled{opacity:.9}.foot-target.chosen{background:#ffdb7b;border-color:#fff}.player{position:absolute;left:50%;bottom:37px;transform:translateX(-50%);width:64px;height:131px;z-index:2;pointer-events:none}.player-head{position:absolute;top:0;left:20px;width:27px;height:29px;border-radius:50%;background:#f3bd88;border:3px solid #1b2846}.player-hair{position:absolute;top:0;left:21px;width:25px;height:9px;background:#28252b;border-radius:50% 50% 20% 20%}.player-shirt{position:absolute;top:31px;left:13px;width:43px;height:42px;border-radius:10px 10px 6px 6px;background:#eaf7ff;border:4px solid #1b92dd;text-align:center;color:#0669af;font-weight:900;font-size:22px}.player-arms:before,.player-arms:after{content:"";position:absolute;top:37px;width:12px;height:38px;background:#f3bd88;border-radius:9px}.player-arms:before{left:2px;transform:rotate(18deg)}.player-arms:after{right:1px;transform:rotate(-18deg)}.player-shorts{position:absolute;top:72px;left:17px;width:36px;height:18px;background:#0869b1;border-radius:4px}.player-leg{position:absolute;top:85px;width:12px;height:43px;background:#dceeff;border:3px solid #1467ad;border-radius:4px;transform-origin:top center}.player-leg.left{left:20px;transform:rotate(9deg)}.player-leg.right{right:11px;transform:rotate(-10deg)}.player.kicking .player-leg.right{animation:kickLeg .45s ease-out}.player-shoe{position:absolute;bottom:0;width:24px;height:10px;border-radius:6px;background:#122d4b}.player-shoe.left{left:11px}.player-shoe.right{right:2px}.foot-ball{position:absolute;bottom:35px;left:calc(50% + 24px);font-size:30px;z-index:3;line-height:1;transition:transform .85s cubic-bezier(.18,.65,.35,1),opacity .85s}.foot-result{position:absolute;top:43%;left:50%;transform:translate(-50%,-50%) scale(.75);padding:13px 16px;border-radius:13px;background:#fffbe9;color:#073765;font-weight:1000;font-size:29px;text-align:center;z-index:5;white-space:nowrap;opacity:0;transition:opacity .25s,transform .25s;box-shadow:0 7px 22px #103d5970}.foot-result.visible{opacity:1;transform:translate(-50%,-50%) scale(1)}.foot-hint{color:#5b6979;font-size:12px;text-align:center}.foot-match-end{text-align:center;padding:18px 4px}.foot-match-end .trophy{font-size:54px}.foot-match-end h2{font-size:26px;color:#075ca2;margin:6px 0}.foot-match-end .loss{color:#ae3143}.foot-match-end p{font-size:16px;line-height:1.55}@keyframes kickLeg{0%{transform:rotate(-10deg)}45%{transform:rotate(52deg)}100%{transform:rotate(-10deg)}}

.football-illustration{position:absolute;bottom:9px;left:44%;width:178px;height:222px;object-fit:contain;object-position:center;transform:translateX(-50%);z-index:2;pointer-events:none;filter:drop-shadow(0 4px 5px #0b473544)}
.football-illustration.kicking{animation:newKick .7s ease-in-out}
@keyframes newKick{0%{transform:translateX(-50%) rotate(0deg) scale(1)}30%{transform:translateX(-48%) rotate(-4deg) scale(1.04)}55%{transform:translateX(-47%) rotate(3deg) scale(1.05)}100%{transform:translateX(-50%) rotate(0deg) scale(1)}}
.learn-input{font-size:23px;direction:rtl;text-align:right;max-width:100%;padding:14px;border:2px solid #afcdea;border-radius:12px}
.learn-options{display:grid;gap:8px;margin:15px 0}
.learn-options button{width:100%;font-size:23px;text-align:right;direction:rtl;background:#f5faff;border:2px solid #d6eafa;border-radius:13px;padding:14px;color:#184b76;font-weight:700}

/* Championnat de l'hébreu : progression sportive en 20 matchs */
.champ-top{background:linear-gradient(135deg,#063c75,#147dd1 65%,#4cb4ed);color:#fff;border-radius:23px;padding:19px 18px;margin:7px 0 14px;position:relative;overflow:hidden}
.champ-top:after{content:'⚽';position:absolute;right:-13px;top:-38px;font-size:145px;opacity:.13;transform:rotate(-17deg)}
.champ-top h2{margin:5px 0 7px;font-size:27px;position:relative}.champ-top p{margin:0;color:#eaf6ff;position:relative}
.champ-stats{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #d6e8f7;border-radius:15px;padding:13px;margin-bottom:12px}
.champ-stats strong{white-space:nowrap;color:#075b9a}.champ-track{flex:1;height:13px;background:#dcebf7;border-radius:40px;overflow:hidden}.champ-track b{height:100%;display:block;background:linear-gradient(90deg,#168cdb,#ffce3d);border-radius:30px;transition:width .3s}
.champ-map{position:relative;min-height:1360px;border-radius:23px;overflow:hidden;background:radial-gradient(ellipse at 50% 5%,#d7f1ff 0%,transparent 30%),linear-gradient(170deg,#9bddff 0%,#e7f7ff 32%,#b2e3ff 49%,#fff3ca 60%,#88c5e9 100%);border:3px solid #fff;box-shadow:0 7px 20px #196fb329}
.champ-map:before{content:'';position:absolute;inset:0;opacity:.22;background:repeating-linear-gradient(-25deg,transparent 0 95px,#fff 96px 99px,transparent 100px 155px);pointer-events:none}
.champ-sky{position:absolute;top:0;left:0;right:0;height:270px;background:radial-gradient(circle at 73% 15%,#fffbc7 0 42px,transparent 44px);pointer-events:none}
.champ-stadium{position:absolute;top:43px;left:8%;width:84%;height:190px;border-radius:54% 54% 20% 20%;background:linear-gradient(#e6f7ff 0 11%,#154b84 12% 26%,#f7faff 27% 31%,#1c80c6 32% 53%,#ffffff 54% 60%,#2179a4 61% 70%,#167b42 71%);border:9px solid #d9f6ff;box-shadow:0 13px 30px #06558044;pointer-events:none}
.champ-stadium:after{content:'FINALE 🏆';position:absolute;top:38%;left:0;width:100%;text-align:center;font-size:23px;color:white;text-shadow:0 2px 4px #014}
.champ-road{position:absolute;top:165px;bottom:45px;width:28%;left:36%;border-radius:90px;border:13px solid #ffdb67;background:linear-gradient(90deg,#f7fcff,#bedfff,#f9fbff);box-shadow:0 0 0 6px #fff9,0 5px 14px #16599a55;pointer-events:none}
.champ-decor{position:absolute;font-size:34px;opacity:.8;pointer-events:none}.champ-decor.d1{top:30%;left:3%}.champ-decor.d2{top:45%;right:5%}.champ-decor.d3{top:67%;left:3%}.champ-decor.d4{bottom:2%;right:3%}
.champ-node{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);border:4px solid #f9d77f;border-radius:50%;width:58px;height:58px;background:linear-gradient(160deg,#fff,#e4eff9);box-shadow:0 5px 0 #9bbed0,0 7px 13px #123d6247;color:#1b5584;font-weight:900;font-size:19px;z-index:1;padding:0;cursor:pointer}
.champ-node.open{background:linear-gradient(#fff7bf,#ffce3a);color:#154b7e;border-color:white;box-shadow:0 0 0 5px #ffe47177,0 5px 13px #a68e31}
.champ-node.cleared{background:linear-gradient(#f6fdff,#74c3ff);color:#044f88;border-color:#ffde66}
.champ-node:disabled{cursor:default;opacity:.78}.champ-node small{display:block;font-size:10px;line-height:1}.champ-node.final{height:75px;width:75px;background:linear-gradient(140deg,#fff2aa,#ffbf26);border-color:white;box-shadow:0 0 22px #fce15a}
.champ-info{position:absolute;bottom:8px;left:8px;right:8px;background:#ffffffed;border-radius:14px;padding:10px;text-align:center;font-size:13px;color:#155083}
.champ-game{background:linear-gradient(160deg,#e8f5ff,#fff);border:1px solid #bad9f0;border-radius:20px;padding:18px}
.champ-vs{display:flex;justify-content:space-around;gap:10px;align-items:center;background:#073e71;color:#fff;border-radius:16px;padding:14px;margin:10px 0;font-weight:800;font-size:17px}
.champ-opts{display:grid;gap:9px;margin:15px 0}.champ-opt{background:white;border:2px solid #d5e8f6;padding:13px;border-radius:12px;font-size:19px;color:#153e62;font-weight:700;min-height:53px}.champ-opt.heopt{direction:rtl;font-size:24px}.champ-opt:disabled{opacity:.7}.champ-opt.good{background:#e0f6e8;border-color:#32a76e}.champ-opt.bad{background:#ffe3e3;border-color:#d85858}
.champ-note{background:#e6f5ff;border-radius:12px;padding:12px;margin:13px 0;color:#174d79}.champ-star{font-size:31px;color:#dfa900}.champ-he{font-size:29px;direction:rtl;text-align:center;font-weight:800;padding:12px 0}.champ-input{font-size:25px;direction:rtl;text-align:right;line-height:1.5}
.champ-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.champ-card{min-height:83px;border:2px solid #c7def0;border-radius:12px;background:#fff;color:#164d80;font-size:17px;padding:7px;overflow-wrap:anywhere}.champ-card.hidden{background:linear-gradient(145deg,#1176c5,#063e75);color:#fff;font-size:29px}.champ-card.done{background:#d8f3df;border-color:#54b77b}.champ-pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.champ-pairs button{min-height:62px;border:2px solid #c6ddf1;border-radius:11px;background:white;color:#174669;font-size:19px;padding:8px;overflow-wrap:anywhere}.champ-pairs button.sel{background:#ffedaa;border-color:#d3a727}.champ-pairs button.done{background:#e6f6e7;color:#4c8563}
@media(max-width:400px){.champ-node{width:49px;height:49px;font-size:17px}.champ-node.final{width:65px;height:65px}.champ-map{min-height:1300px}}

div><p class="muted">Les questions alternent entre hébreu → français et français → hébreu. Les erreurs reviennent plus souvent.</p><label>Je veux réviser</label><select id="focus"><option>À consolider</option><option>Tous</option>${[...new Set(WORDS.map(w=>w.cat))].map(c=>`<option>${safe(c)}</option>`).join('')}</select><div class="actions"><button class="btn" data-start="1">Commencer</button></div></div>`;let q=quiz;return `<div class="card"><div class="eyebrow">${q.reverse?'FRANÇAIS → HÉBREU':'HÉBREU → FRANÇAIS'}</div><div class="title">${q.reverse?'Comment dit-on en hébreu ?':'Que signifie ce mot ?'}</div>${q.reverse?`<h2>${safe(q.w.fr)}</h2>`:`<div class="he">${heb(q.w.he)}</div><div class="phon">${safe(q.w.ph)}</div>${speakBtn(q.w.he)}`}${q.opts.map((w,i)=>`<button class="choice ${selected===i?'selected':''}" data-choice="${i}" ${checked?'disabled':''}>${q.reverse?`<span dir="rtl" style="font-size:23px">${hebField(w,"he")}</span>`:safe(w.fr)}</button>`).join('')}${checked?`<div class="feedback ${selected===q.correct?'':'bad'}"><b>${selected===q.correct?'Bravo ! 🇮🇱':'À revoir'}</b><div>Bonne réponse : <b>${heb(q.w.he)}</b> — ${safe(q.w.fr)}</div><div class="phon">${safe(q.w.ph)}</div>${q.w.female?`Présent féminin : <b>${safe(q.w.female)}</b>`:''}</div><div class="actions"><button class="btn" data-next="1">Question suivante</button></div>`:`<div class="actions"><button class="btn" data-check="1" ${selected===null?'disabled':''}>Vérifier</button></div>`}</div>`}function startMemory(){let all=WORDS.filter(w=>!store.known[w.id]);if(!all.length)all=WORDS;let ids=all.map(w=>w.id);store.memoryCycle=store.memoryCycle.filter(id=>ids.includes(id));let remaining=all.filter(w=>!store.memoryCycle.includes(w.id));if(remaining.length<Math.min(memorySize,all.length)){store.memoryCycle=[];remaining=all}let a=shuffle(remaining).slice(0,Math.min(memorySize,remaining.length));store.memoryCycle.push(...a.map(w=>w.id));store.memoryCount=store.memoryCycle.length;save();memory={items:a,order:shuffle(a),matched:[],attempts:0};memorySelected=null;memoryWrong=false;setTab('memory')}function memoryView(){if(!memory)return `<div class="card"><div class="eyebrow">Jeu d’associations</div><div class="title">Relie les verbes 🎯</div><p class="muted">Des séries différentes jusqu’à avoir parcouru tous les mots. Les erreurs seront ajoutées à tes révisions.</p><label>Paires par partie</label><select id="memory-size"><option value="5" ${memorySize===5?'selected':''}>5 paires</option><option value="6" ${memorySize===6?'selected':''}>6 paires</option></select><p class="muted">Cycle : ${store.memoryCycle.length} / ${WORDS.filter(w=>!store.known[w.id]).length} mots parcourus</p><button class="btn" data-memory-start="1">Jouer</button></div>`;let m=memory,done=m.matched.length;return `<div class="card"><div class="eyebrow">Memory des verbes</div><div class="title">${done===m.items.length?'Bravo, partie terminée ! 🇮🇱':'Associe les deux colonnes'}</div><p class="muted">${done}/${m.items.length} paires · ${m.attempts} essais · Cycle : ${store.memoryCycle.length}/${WORDS.filter(w=>!store.known[w.id]).length}</p><div class="progress"><div style="width:${100*done/m.items.length}%"></div></div><p class="muted">Appuie sur un verbe en hébreu, puis sur sa traduction.</p><div class="memorycols"><div class="memorylist">${m.items.map(w=>`<button class="matchbtn hebrew ${m.matched.includes(w.id)?'done':memorySelected===w.id?'chosen':''}" data-memory-he="${safe(w.id)}" ${m.matched.includes(w.id)?'disabled':''}>${hebField(w,"he")}</button>`).join('')}</div><div class="memorylist">${m.order.map(w=>`<button class="matchbtn ${m.matched.includes(w.id)?'done':''}" data-memory-fr="${safe(w.id)}" ${m.matched.includes(w.id)?'disabled':''}>${safe(w.fr)}</button>`).join('')}</div></div>${memoryWrong?'<p style="color:#A54651">Essaie encore !</p>':''}${done===m.items.length?'<div class="feedback">Partie réussie !</div>':''}<div class="actions"><button class="btn" data-memory-start="1">${done===m.items.length?'Nouvelle partie':'Recommencer'}</button></div></div>`}function review(){let a=WORDS.filter(w=>(store.missed[w.id]||0)>0).sort((x,y)=>(store.missed[y.id]||0)-(store.missed[x.id]||0));return `<div class="card"><div class="eyebrow">Révision personnalisée</div><div class="title">Mes verbes difficiles</div><p class="muted">Les mots ratés sont prioritaires. Un mot réussi plusieurs fois devient moins fréquent.</p>${a.length?a.map(w=>`<div class="word"><b dir="rtl">${hebField(w,"he")}</b> — ${safe(w.fr)} <span class="pill">${store.missed[w.id]} erreur(s)</span></div>`).join(''):'<div class="notice">Aucune erreur enregistrée pour le moment.</div>'}<button class="btn" data-review="1">Réviser maintenant</button></div>`}function progress(){return `<div class="card"><div class="eyebrow">Tes progrès</div><div class="title">Tu avances à ton rythme</div><div class="grid"><div class="stat"><b>${store.stats.done}</b>Questions</div><div class="stat"><b>${store.stats.done?Math.round(100*store.stats.correct/store.stats.done):0}%</b>Réussite</div><div class="stat"><b>${Object.keys(store.seen).length}</b>Mots étudiés</div><div class="stat"><b>${WORDS.filter(w=>store.missed[w.id]>0).length}</b>À revoir</div></div><p class="muted">Les résultats restent dans ce navigateur sur cet appareil.</p><div class="actions"><button class="btn secondary" data-export="1">Sauvegarder mes progrès</button><label style="margin:0"><span class="btn ghost" style="display:inline-block">Restaurer une sauvegarde</span><input type="file" id="restore" accept="application/json" style="display:none"></label></div></div>`}function rolesView(){if(role===null)return `<div class="card"><div class="eyebrow">Mode aventure 🎭 · Kita Alef</div><div class="title">5 aventures faciles de 20 échanges</div><p class="muted">Toutes les phrases et toutes les réponses sont en hébreu. Appuie sur 💡 seulement si tu as besoin d’une traduction. Utilise 💡 si tu ne comprends pas. Les phrases sont courtes et au niveau Alef.</p>${MISSIONS.map((m,i)=>`<button class="choice" data-role="${i}"><b>${safe(m.name)}</b><div class="muted">${safe(m.intro)} · ${m.steps.length} échanges</div></button>`).join('')}</div>`;let m=MISSIONS[role],end=roleStep<0||roleStep>=m.steps.length;if(end)return `<div class="card"><div class="eyebrow">${safe(m.name)}</div><div class="title">${roleStep<0?'Mission interrompue':'🇮🇱 Mission terminée !'}</div><p class="muted">${roleHistory.length} échanges · ${roleErrors} réponse(s) à revoir · ${roleHints} aide(s) consultée(s)</p><div class="title">Bilan et traductions</div>${roleHistory.map(h=>`<div class="word"><div class="he" style="font-size:22px">${heb(h.he)}</div><div class="muted">${safe(h.questionFr)}</div><div class="he" style="font-size:20px">${heb(h.choice)}</div><div class="muted">${safe(h.meaning)} · ${h.score===-1?'Hors sujet':h.score===0?'Réponse possible, mais moins adaptée':'Réponse adaptée'}</div></div>`).join('')}<div class="actions"><button class="btn" data-role-retry="1">Rejouer</button><button class="btn secondary" data-role-back="1">Autre aventure</button></div></div>`;let q=m.steps[roleStep];return `<div class="card"><button class="btn ghost" data-role-back="1">← Aventures</button><div class="eyebrow">${safe(m.name)} · Échange ${roleStep+1}/${m.steps.length}</div><div class="progress"><div style="width:${100*roleStep/m.steps.length}%"></div></div><p class="muted">${safe(q.who)} :</p><div class="he" dir="rtl">${heb(q.he)}</div><div class="actions">${speakBtn(q.he)}<button class="btn ghost" data-role-hint="question">💡</button></div>${roleShowHints.question?`<div class="feedback">${safe(q.fr)}</div>`:''}<div class="title" style="margin-top:24px">מה אתה עונה?</div>${q.opts.map((o,i)=>`<div class="role-option"><button class="choice role-answer" data-role-answer="${i}" dir="rtl">${heb(o[0])}</button><button class="btn ghost role-hint" data-role-hint="${i}" aria-label="Traduire cette réponse">💡</button>${roleShowHints[i]?`<div class="muted" style="padding:0 // V8 : jeux de verbes. Même stockage local que les versions précédentes.
const VERBS=WORDS.filter(w=>w.male&&w.female&&w.past);
function uniqueChoices(correct,other){return shuffle([correct,...other.filter(x=>x!==correct).filter((x,i,a)=>a.indexOf(x)===i).slice(0,3)]).slice(0,4)}
function makeMystery(){
 const candidates=VERBS.filter(w=>w.female&&w.male&&w.female!==w.male);
 const w=pick(candidates);const form=pick(['female','male','past']);
 let phrase=form==='female'?'היא ___ עכשיו.':form==='male'?'הוא ___ עכשיו.':'אתמול אני ___.',answer=form==='female'?w.female:form==='male'?w.male:w.past;
 if(!answer)return makeMystery();
 let others=[w.he,w.female,w.male,w.past,...shuffle(candidates.filter(x=>x.id!==w.id)).map(x=>x[form])].filter(Boolean);
 let opts=uniqueChoices(answer,others);
 // For a blank with subject, alternatives of the same verb are always grammatically relevant.
 if(opts.length<4)return makeMystery();
 mystery={w,form,phrase,answer,opts,chosen:null,done:false};
}
function mysteryView(){if(!mystery)return `<div class="card"><div class="eyebrow">Nouveau jeu · Conjugaison</div><div class="title">🧩 Le verbe mystère</div><p class="muted">Complète les phrases en choisissant la bonne forme du verbe. Présent féminin, masculin et passé. Les réponses sont en hébreu.</p><button class="btn" data-mystery-start="1">Commencer</button></div>`;
 let m=mystery;return `<div class="card"><div class="eyebrow">Le verbe mystère</div><div class="muted">Verbe : ${safe(m.w.fr)} <span dir="rtl" style="font-size:19px">(${heb(m.w.he)})</span></div><div class="he" style="margin:24px 0">${heb(m.phrase)}</div>${m.opts.map((x,i)=>`<button class="choice ${m.chosen===i?'selected':''}" dir="rtl" data-mystery-pick="${i}" ${m.done?'disabled':''}>${heb(x)}</button>`).join('')}${m.done?`<div class="feedback ${m.opts[m.chosen]===m.answer?'':'bad'}"><b>${m.opts[m.chosen]===m.answer?'Bravo ! 🇮🇱':'À revoir'}</b><div dir="rtl">${heb(m.phrase.replace('___',m.answer))}</div><div class="muted">${safe(m.w.fr)}</div></div><button class="btn" data-mystery-next="1">Phrase suivante →</button>`:''}</div>`}
function resetSurvival(){
 const all=shuffle(VERBS);survival={items:all,index:0,started:Date.now(),failed:false,finished:false,question:null};
 makeSurvivalQuestion();
 if(survivalTimer)clearInterval(survivalTimer);
 survivalTimer=setInterval(()=>{const t=document.getElementById('survival-clock');if(t&&survival)t.textContent=elapsedSurvival()},250);
}
function elapsedSurvival(){if(!survival)return '0:00';let sec=Math.floor(((survival.finishedAt||Date.now())-survival.started)/1000);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function makeSurvivalQuestion(){
 const w=survival.items[survival.index],reverse=survival.index%2===1;
 const bad=shuffle(VERBS.filter(x=>x.id!==w.id&&x.fr!==w.fr));
 const answer=reverse?w.fr:w.he;
 const options=uniqueChoices(answer,bad.map(x=>reverse?x.fr:x.he));
 survival.question={w,reverse,answer,options};
}
function survivalView(){if(!survival)return `<div class="card"><div class="eyebrow">Nouveau jeu · Challenge</div><div class="title">🏆 Le défi zéro faute</div><p class="muted">${VERBS.length} verbes, mélangés et sans répétition. Un seul mauvais choix : partie perdue et retour au début. Le chronomètre mesure ta rapidité, sans limite de temps.</p><div class="grid"><div class="stat"><b>${store.survivalBest}</b><span class="muted">Record de suite</span></div><div class="stat"><b>${store.survivalBestTime===null?'—':safe(store.survivalBestTime)}</b><span class="muted">Meilleur temps complet</span></div></div><div class="actions"><button class="btn" data-survival-start="1">Lancer le défi</button></div></div>`;
 let t=survival,q=t.question;
 let head=`<div class="eyebrow">🏆 Zéro faute</div><div class="grid"><div class="stat"><b>${t.index} / ${t.items.length}</b><span class="muted">Bonnes réponses</span></div><div class="stat"><b id="survival-clock">${elapsedSurvival()}</b><span class="muted">Chronomètre</span></div></div><div class="progress" style="margin-top:12px"><div style="width:${100*t.index/t.items.length}%"></div></div>`;
 if(t.failed)return `<div class="card">${head}<div class="title">❌ Perdu !</div><p>Tu avais enchaîné <b>${t.index} bonne(s) réponse(s)</b>. Une erreur = retour à zéro.</p><div class="feedback bad"><div>Question : ${safe(q.reverse?pointed(q.w.he):q.w.fr)}</div><div>Bonne réponse : <b>${heb(q.answer)}</b></div></div><p class="muted">Record personnel : ${store.survivalBest} / ${VERBS.length}</p><button class="btn" data-survival-start="1">Recommencer depuis zéro</button></div>`;
 if(t.finished)return `<div class="card">${head}<div class="title">🇮🇱 Sans-faute total !</div><p>Bravo ! ${VERBS.length} verbes sans une seule erreur en <b>${elapsedSurvival()}</b>.</p><p class="muted">Meilleur temps : ${safe(store.survivalBestTime)}</p><button class="btn" data-survival-start="1">Rejouer</button></div>`;
 return `<div class="card">${head}<p class="muted" style="margin-top:22px">${q.reverse?'Que veut dire ce verbe ?':'Traduis ce verbe en hébreu :'}</p>${q.reverse?`<div class="he">${heb(q.w.he)}</div>`:`<div class="title">${safe(q.w.fr)}</div>`}${q.options.map((o,i)=>`<button class="choice" data-survival-answer="${i}" ${q.reverse?'':'dir="rtl"'}>${safe(o)}</button>`).join('')}<p class="muted small">Une seule erreur et la série recommence. Record : ${store.survivalBest}.</p><button class="btn ghost" data-survival-exit="1">Quitter la partie</button></div>`;
}

// Clasico des verbes : 10 questions = 10 tirs, chaque bonne réponse donne un but à Marseille.
let football=null;
const FOOTBALL_SHOTS=10;
function startFootball(){football={items:shuffle(VERBS).slice(0,FOOTBALL_SHOTS),index:0,om:0,psg:0,locked:false,complete:false,answer:null};nextFootballQuestion();setTab('football')}
function nextFootballQuestion(){if(!football||football.index>=football.items.length){football.complete=true;return}const w=football.items[football.index];const candidates=shuffle(VERBS.filter(v=>v.id!==w.id&&v.fr!==w.fr));football.question={w,options:shuffle([w,...candidates.slice(0,3)]).map(v=>({id:v.id,label:v.fr}))};football.locked=false;football.answer=null}
function footballView(){if(!football)return `<div class="card"><div class="eyebrow">Nouveau jeu · Spécial supporters</div><div class="title">⚽ Le Clasico des verbes</div><p class="muted">Marseille contre Paris ! Tu es le buteur de l’OM. Lis le verbe en hébreu et sélectionne sa traduction pour tirer. Chaque bonne réponse : un but pour Marseille. Chaque erreur : un but pour Paris.</p><p class="muted"><b>${FOOTBALL_SHOTS} tirs par match</b> · Des verbes simples de Kita Alef · Pas besoin de son.</p><button class="btn" data-foot-start="1">⚽ Jouer le match !</button></div>`;

// Diriger le ballon vers le centre de la réponse choisie, quelle que soit la largeur du téléphone.

function clearPoints(text){return String(text||'').normalize('NFD').replace(/[\u0591-\u05C7]/g,'').normalize('NFC')}
function normalizedHeb(text){return clearPoints(text).replace(/[\s.,!?״׳]/g,'').trim()}
function learnPool(){return VERBS.filter(w=>w.he&&w.male&&w.female&&w.past && normalizedHeb(w.he)!==normalizedHeb(w.male))}
let conjugate=null, fillGame=null;
